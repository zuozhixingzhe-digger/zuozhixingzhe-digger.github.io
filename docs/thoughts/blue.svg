<?xml version="1.0" encoding="UTF-8"?>
<!--
  HTerMinaL · 蓝点 = 置于所有窗口最下面
  ─────────────────────────────────────────────────────────────────────
  基准 = original/blue.svg（手绘原稿）。
  原稿是两片互相咬合的方形：左上一个大块、右下一个小 L，两者之间留一条十字缝。
  它最聪明的地方是**没有画两扇完整的窗**，只画"露出来的那块"，靠缝讲遮挡关系。
  这个结构原样保留。

  改动两处，都是尺寸问题：
    a. 原稿的缝只有 0.37mm。整张图 212.3mm 高缩到 26px，0.37mm = **0.045px**，
       缝会彻底消失，两块粘成一块方块，语义就没了。所以把缝重新给到 1 个单位左右
       （竖缝 0.45、横缝 1.0，见下面的数值），两块的形状与咬合关系不变。
    b. 白描边去掉，填充换深墨。

  缩放：原稿 bbox 131.671 × 212.302 → 26px 高，居中放进 ⌀40 的圆点。
  下面这条路径已经换算到 40×40 坐标，不再是原稿的 mm 值 —— 这是四个文件里唯一的例外。
  ─────────────────────────────────────────────────────────────────────
-->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"
     role="img" aria-labelledby="t d">
  <title id="t">置于底层</title>
  <desc id="d">蓝色圆点，内为两片咬合的方形：左上实块与右下 L 形，中间一条十字缝。</desc>

  <circle cx="20" cy="20" r="20" fill="#00ffff"/>

  <g fill="#000" opacity=".58">
    <!-- 左上块（原 rect1）：上面宽、下面窄，右侧让出给右下块 -->
    <path d="M 11.94 7 H 22.40 V 15.61 H 16.07 V 24.31 H 11.94 Z"/>
    <!-- 右下块（原 rect2）：外框 + 左上挖空，evenodd 挖出 L -->
    <path fill-rule="evenodd"
          d="M 16.87 15.61 V 33 H 28.06 V 15.61 Z
             M 16.87 16.41 H 22.40 V 24.21 H 16.87 Z"/>
  </g>
</svg>
