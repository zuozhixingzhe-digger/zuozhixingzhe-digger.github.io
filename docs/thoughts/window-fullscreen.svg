<?xml version="1.0" encoding="UTF-8"?>
<!--
  HTerMinaL · 全屏态（window.svg 的唯一变体）
  ─────────────────────────────────────────────────────────────────────
  全屏时窗口不再「浮着」：它铺满视口。于是两件在普通态靠「透明」解决的问题失效了 ——

    · 四个圆角把画面切出四个缺口，普通态这里露出桌面，全屏时没有桌面可露；
    · 提手原本抬在画面【外面】，全屏时外面就是屏幕边缘，它无处可站。

  规则：凡是普通态「本该透明、露出背后」的地方，全屏时一律改成毛玻璃。
        · 四角缺口 → 毛玻璃
        · 提手翻进画面内，变成一个向下的梯形凹槽 → 毛玻璃

  这样全屏既不会露出背后的桌面，也不会有「窗口被裁掉一块」的感觉。

  本图同时演示标题截断：提手宽度固定，标题塞不下就中间截断 →
  hsl2 · FreeBSD 12.0 (v86)  →  hsl2 · FreeS…12.0 (v86)
  ─────────────────────────────────────────────────────────────────────
-->
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="600" viewBox="0 0 768 600"
     fill="none" role="img" aria-labelledby="t d">
  <title id="t">HTerMinaL 窗口（全屏态）</title>
  <desc id="d">窗口铺满视口，顶部中央是一个向下凹的梯形毛玻璃凹槽，四角缺口同样填毛玻璃，标题在凹槽内被中间截断。</desc>

  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#131820"/>
      <stop offset=".55" stop-color="#0d1117"/>
      <stop offset="1"   stop-color="#0a0d12"/>
    </linearGradient>

    <!-- 背后的桌面：没有它就看不出毛玻璃在磨什么 -->
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#1b2b47"/>
      <stop offset=".5"  stop-color="#2a1f3d"/>
      <stop offset="1"   stop-color="#102a33"/>
    </linearGradient>

    <!-- 玻璃的雾：上亮下暗，模拟斜上方来光 -->
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"  stop-color="#ffffff" stop-opacity=".115"/>
      <stop offset=".7" stop-color="#ffffff" stop-opacity=".055"/>
      <stop offset="1"  stop-color="#ffffff" stop-opacity=".030"/>
    </linearGradient>

    <radialGradient id="gloss" cx=".36" cy=".26" r=".78">
      <stop offset="0"   stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- 磨砂颗粒：去色的分形噪声压到很低不透明度，只提供「沙」 -->
    <filter id="grain" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="17" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g"><feFuncA type="linear" slope=".20" intercept="0"/></feComponentTransfer>
    </filter>

    <filter id="blurBig" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>

    <!-- 四角缺口 = 视口矩形 挖掉 圆角矩形（evenodd） -->
    <path id="cornerGaps" fill-rule="evenodd"
          d="M 0 0 H 768 V 600 H 0 Z
             M 14 0 H 754 Q 768 0 768 14 V 586 Q 768 600 754 600 H 14 Q 0 600 0 586 V 14 Q 0 0 14 0 Z"/>

    <!-- 提手凹槽：普通态提手的镜像（上宽 312，下窄 200，深 48） -->
    <path id="notch" d="M 228 0 H 540 L 484 48 Q 478 52 470 52 H 298 Q 290 52 284 48 Z"/>

    <!-- 画面轮廓 -->
    <path id="frame" d="M 14 0 H 754 Q 768 0 768 14 V 586 Q 768 600 754 600 H 14 Q 0 600 0 586 V 14 Q 0 0 14 0 Z"/>

    <clipPath id="clipGaps"><use href="#cornerGaps"/></clipPath>
    <clipPath id="clipNotch"><use href="#notch"/></clipPath>
  </defs>

  <!-- 桌面（仅作背景参照）：一个被模糊处理的渐变，模拟「背后有东西」 -->
  <g>
    <rect width="768" height="600" fill="url(#desk)"/>
    <g filter="url(#blurBig)" opacity=".75">
      <circle cx="140" cy="130" r="140" fill="#3b82f6" opacity=".45"/>
      <circle cx="670" cy="480" r="160" fill="#a855f7" opacity=".40"/>
      <circle cx="420" cy="40"  r="90"  fill="#22d3ee" opacity=".35"/>
    </g>
  </g>

  <!-- ── 毛玻璃 A：四角缺口 ── -->
  <g clip-path="url(#clipGaps)">
    <rect width="768" height="600" fill="url(#haze)"/>
    <rect width="768" height="600" filter="url(#grain)"/>
  </g>

  <!-- ── 画面：铺满视口，圆角 14 ── -->
  <use href="#frame" fill="url(#screen)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="13" letter-spacing=".2" xml:space="preserve">
    <text x="52" y="132" fill="#5eead4">JSHeL&gt; <tspan fill="#cbd5e1">hsl2()</tspan></text>
    <text x="52" y="156" fill="#5b6b7f">  · 已缓存 6 项组件 · FreeBSD 12.0 运行中</text>
    <text x="52" y="188" fill="#7c8ea3">root@nyu:~ # <tspan fill="#cbd5e1">df -h</tspan></text>
    <text x="52" y="212" fill="#8fa3b8">Filesystem   Size  Used  Avail  Capacity  Mounted on</text>
    <text x="52" y="236" fill="#8fa3b8">/dev/ada0p2  1.9G  412M   1.4G       23%  /</text>
    <text x="52" y="268" fill="#7c8ea3">root@nyu:~ # <tspan fill="#7c8ea3">▍</tspan></text>
  </g>

  <!-- ── 毛玻璃 B：提手凹槽 ──
       凹槽里的画面本身就是暗的，所以这里要的不是「亮」，而是
       雾层 + 颗粒 + 一条槽底高光，把凹槽读成一块有厚度的玻璃 -->
  <g clip-path="url(#clipNotch)">
    <use href="#frame" fill="url(#screen)"/>
    <rect width="768" height="600" fill="url(#haze)"/>
    <rect width="768" height="600" filter="url(#grain)"/>
  </g>
  <use href="#notch" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="1"/>
  <path d="M 284 48 Q 290 52 298 52 H 470 Q 478 52 484 48"
        stroke="#ffffff" stroke-opacity=".24" stroke-width="1"/>

  <!-- 画面外缘 1px -->
  <use href="#frame" stroke="#ffffff" stroke-opacity=".14" stroke-width="1"/>
  <path d="M 228 0 H 540" stroke="#ffffff" stroke-opacity=".20" stroke-width="1"/>

  <!-- 四枚色点：与普通态同一套相对位置（距中心 ±228 / ±166），cy 落在凹槽带中间 -->
  <g>
    <circle cx="156" cy="24" r="7" fill="#FF4A3D"/><circle cx="156" cy="24" r="6.9" fill="url(#gloss)"/>
    <circle cx="218" cy="24" r="7" fill="#FFCC00"/><circle cx="218" cy="24" r="6.9" fill="url(#gloss)"/>
    <circle cx="550" cy="24" r="7" fill="#2FD158"/><circle cx="550" cy="24" r="6.9" fill="url(#gloss)"/>
    <circle cx="612" cy="24" r="7" fill="#35C5F2"/><circle cx="612" cy="24" r="6.9" fill="url(#gloss)"/>
  </g>

  <!-- 标题：塞不下 → 中间截断，提手宽度不变 -->
  <!-- 真实标题（塞不下，故意留长以便演示规则）：
       hsl2 · FreeBSD 12.0-RELEASE r341666 · 第 1 层
       中间截断后保留头（身份）与尾（状态），提手宽度一个像素都不变。
       注意：截断的长度必须以【凹槽在文字底线处的宽度】为准，不能只按视觉估，
       否则字会压到斜边上（这一版就是这么错的，已按实测宽度收紧）。 -->
  <text x="384" y="34" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif"
        font-size="15" font-weight="500" letter-spacing=".3"
        fill="#e8eef6" fill-opacity=".95">hsl2 · FreeBSD 12.0…第 1 层</text>
</svg>
