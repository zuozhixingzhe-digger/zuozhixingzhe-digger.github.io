<?xml version="1.0" encoding="UTF-8"?>
<!--
  HTerMinaL · 窗口 chrome 全屏态
  ─────────────────────────────────────────────────────────────────────
  原稿没有全屏图。这一张是按原稿的规则推出来的：
    「普通态靠透明藏起来的地方，全屏时一律换成毛玻璃。」

  普通态有两个"缺口"是透明的：
    a. 提手底部与画面顶边之间的两个阴角（x 29.219~73.973 和 143.137~189.370，y 64.171~80.260）
    b. 提手本身凸在画面之外
  全屏时没有桌面可露，这两块一起填成一条毛玻璃带 —— 画面顶边因此变得平直。

  几何全部沿用 window.svg，一个数值没改：
    · 提手带 y 64.171 ~ 80.260（高 16.089）
    · 色点 cy 72.216，x 58.395 / 72.195 / 146.395 / 160.195
    · 标题基线 y 77.35
  变的只有：画面顶边从 80.260 上移到 64.171，多出来的一条是毛玻璃。
  ─────────────────────────────────────────────────────────────────────
-->
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="24 57 170 145"
     fill="none" role="img" aria-labelledby="t d">
  <title id="t">HTerMinaL 窗口 · 全屏</title>
  <desc id="d">画面向上扩到提手顶端，原来的缺口填成一条毛玻璃带，标题与四枚色点仍在原位置。</desc>

  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#131820"/>
      <stop offset=".55" stop-color="#0d1117"/>
      <stop offset="1"   stop-color="#0a0d12"/>
    </linearGradient>

    <!-- 毛玻璃带：顶部略亮，向下淡出，接到画面本体 -->
    <linearGradient id="frost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset=".72" stop-color="#ffffff" stop-opacity=".045"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity=".012"/>
    </linearGradient>

    <!-- 细颗粒：玻璃不是纯色，加一层噪点才有厚度 -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
    </filter>

    <filter id="cast" x="-12%" y="-8%" width="124%" height="126%">
      <feDropShadow dx="0" dy="3.2" stdDeviation="4.5" flood-color="#000" flood-opacity=".6"/>
    </filter>

    <clipPath id="clipAll">
      <rect x="29.219" y="64.171" width="160.151" height="126.678" rx="3"/>
    </clipPath>
  </defs>

  <g filter="url(#cast)">
    <!-- 画面：顶边上移到提手顶端，左右与底边不变 -->
    <rect x="29.219" y="64.171" width="160.151" height="126.678" rx="3" fill="url(#screen)"/>

    <!-- 缺口填平：毛玻璃带（雾层 + 颗粒） -->
    <g clip-path="url(#clipAll)">
      <rect x="29.219" y="64.171" width="160.151" height="16.089" fill="url(#frost)"/>
      <rect x="29.219" y="64.171" width="160.151" height="16.089" filter="url(#grain)"/>

      <!-- 原提手轮廓留在带子里，只是一道极淡的凸起：位置还在，边界已经不属于画面 -->
      <path d="M 73.973 80.260 L 88.027 65.171 Q 88.027 64.171 89.027 64.171 L 129.562 64.171 Q 130.562 64.171 130.562 65.171 L 143.137 80.260 Z"
            fill="#ffffff" fill-opacity=".035"/>
      <path d="M 73.973 80.260 L 88.027 65.171 Q 88.027 64.171 89.027 64.171 H 129.562 Q 130.562 64.171 130.562 65.171 L 143.137 80.260"
            fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width=".3"/>

      <!-- 带的底缘：一道 1px 的厚度高光，说明玻璃压在画面上 -->
      <path d="M 29.219 80.260 H 189.370" stroke="#ffffff" stroke-opacity=".09" stroke-width=".3"/>
    </g>

    <g clip-path="url(#clipAll)">
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
         font-size="3.2" letter-spacing=".02" xml:space="preserve">
        <text x="35.2" y="90.2" fill="#5eead4">JSHeL&gt; <tspan fill="#cbd5e1">hsb2()</tspan></text>
        <text x="35.2" y="95.2" fill="#5b6b7f">  · 已缓存 6 项组件 · FreeBSD 12.0 运行中</text>
        <text x="35.2" y="102.2" fill="#7c8ea3">root@nyu:~ # <tspan fill="#cbd5e1">uname -a</tspan></text>
        <text x="35.2" y="107.2" fill="#8fa3b8">FreeBSD nyu 12.0-RELEASE r341666 GENERIC  i386</text>
        <text x="35.2" y="114.2" fill="#7c8ea3">root@nyu:~ # <tspan fill="#8fa3b8">▍</tspan></text>
      </g>
    </g>

    <!-- 轮廓：整块矩形，顶边平直（缺口已经填平） -->
    <rect x="29.219" y="64.171" width="160.151" height="126.678" rx="3"
          stroke="#ffffff" stroke-opacity=".13" stroke-width=".3"/>
  </g>

  <!-- 色点：位置与普通态完全一致 -->
  <g>
    <circle cx="58.395" cy="72.216" r="5" fill="#ff0000" stroke="#ffffff" stroke-opacity=".22" stroke-width=".25"/>
    <circle cx="72.195" cy="72.216" r="5" fill="#ffcc00" stroke="#ffffff" stroke-opacity=".22" stroke-width=".25"/>
    <circle cx="146.395" cy="72.216" r="5" fill="#00ff00" stroke="#ffffff" stroke-opacity=".22" stroke-width=".25"/>
    <circle cx="160.195" cy="72.216" r="5" fill="#00ffff" stroke="#ffffff" stroke-opacity=".22" stroke-width=".25"/>
  </g>

  <!-- 长标题：这里演示"塞不下就中间截断，绝不撑大提手"。
       可用宽 = 标题基线处提手的宽度（提手在该高度的半宽 32.17 − 左右各 2 的呼吸）≈ 60mm ≈ 241px。
       完整标题 45 字符要 320px，所以砍中间，保留头（身份）+ 尾（状态）。 -->
  <text x="109.295" y="77.35" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif"
        font-size="4.2" font-weight="500" letter-spacing=".04"
        fill="#e8eef6" fill-opacity=".92">hsb2 · FreeBSD 12.0…第 1 层</text>
</svg>
