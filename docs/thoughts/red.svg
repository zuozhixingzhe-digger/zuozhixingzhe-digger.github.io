<?xml version="1.0" encoding="UTF-8"?>
<!--
  HTerMinaL · 红点 = 退出程序 / 关闭窗口
  ─────────────────────────────────────────────────────────────────────
  基准 = original/red.svg（手绘原稿）。形状是原稿的，不是重画的：

    ① 框：上、左、下三条边，右边整条开口 —— 原稿 rect12 / rect13 / rect14 三条矩形
    ② 月牙：从框内 (82.479,102.822) 向右下甩到 (184.931,203.055) 的一支梭形，
       尾巴探出下横条 —— 原稿 path14 的两段三次贝塞尔，一条上去、一条回来

  只动了三处，都是画错了的地方：
    a. 三条矩形的底边对不齐（198.247 / 197.876），合并成一条闭合路径并对到 197.876。
       不合并的话，三条白描边会在接缝处各画一道线。
    b. path14 里有一段 `-9.24658,138.69863 0,-0.36986 0,-0.36986 0,0` —— 控制点飞到
       画布外 y=340，是 Inkscape 拖节点留下的残迹。删掉后形状回到原稿本来要画的那支月牙。
    c. 白描边去掉。原稿的 stroke:#fff 是"画在白纸上才看得见"的产物，落到彩色圆点上
       它就是一圈噪点。填充改深墨统一色，四枚按钮的分量才一致。

  缩放：原稿 bbox 147.205 × 153.493 → 26px 高，居中放进 ⌀40 的圆点。
  ─────────────────────────────────────────────────────────────────────
-->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"
     role="img" aria-labelledby="t d">
  <title id="t">关闭</title>
  <desc id="d">红色圆点，内为右侧开口的方框，一支月牙从框内向右下甩出。</desc>

  <circle cx="20" cy="20" r="20" fill="#ff0000"/>

  <!-- 组不透明度：框与月牙重叠处不会叠深 -->
  <g transform="translate(1.142 -1.395) scale(.16939)" fill="#000" opacity=".58">
    <!-- ① 框：三条边合并成一条闭合路径 -->
    <path d="M 37.726 49.562 H 181.603 V 64.726 H 56.589 V 177.534 H 149.425 V 197.876 H 37.726 Z"/>
    <!-- ② 月牙：原稿两段贝塞尔，去掉中间那段控制点漂移 -->
    <path d="M 82.479 102.822 c 0,0 111.699,-38.466 102.452,100.233
             c 0,0 -19.233,-61.397 -102.452,-99.863 z"/>
  </g>
</svg>
