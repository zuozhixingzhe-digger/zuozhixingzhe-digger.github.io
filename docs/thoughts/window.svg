<?xml version="1.0" encoding="UTF-8"?>
<!--
  HTerMinaL · 窗口 chrome 主图（静止态）
  ─────────────────────────────────────────────────────────────────────
  基准 = original/window.svg（手绘原稿，Inkscape，210×297mm 画布）
  本文件是原稿的**修订版**，不是重画：

    · 坐标仍是原稿的 mm 数值，没有换算、没有缩放、没有挪位
    · viewBox="24 57 170 145" 只是把 A4 白边切掉，图形位置一个像素没动
    · width/height = viewBox × 4，所以下面任何数值 ×4 就是屏幕像素

  改动只有 6 条，逐条见 docs/thoughts/README.md §5：
    1. 画布 A4 → 内容 bbox（唯一的结构性改动）
    2. 提手两只脚的 y 从 79.890 / 79.150 收到画面顶边 80.260（原稿漏了 0.4~1.1mm 的缝）
    3. 提手顶边两端 y 不同（64.356 / 63.986）→ 统一 64.171
    4. 四个椭圆 → 正圆 r=5.0、cy=72.22、左右严格镜像（原稿 rx/ry 差 0.3~0.5，左右差 5mm）
    5. 配色反转：白纸黑线 → 深底浅线（原稿是设计稿的画法，不是成品配色）
    6. 画面加圆角 rx=3（原稿是直角；"模仿 macOS"要求圆角，这是补的，不是原稿的）
  ─────────────────────────────────────────────────────────────────────
-->
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="24 57 170 145"
     fill="none" role="img" aria-labelledby="t d">
  <title id="t">HTerMinaL 窗口</title>
  <desc id="d">深色画面浮在透明背景上，顶部中央抬起一条梯形提手，提手两肩各两枚色点：左红黄、右绿蓝。</desc>

  <defs>
    <!-- 画面底色。原稿是白色（设计稿的纸），成品是深色终端 -->
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#131820"/>
      <stop offset=".55" stop-color="#0d1117"/>
      <stop offset="1"   stop-color="#0a0d12"/>
    </linearGradient>

    <!-- 提手：画面向上凸出的把手，是实体，不是浮在外面的玻璃。
         这一点是这次返工最大的修正 —— 填成半透明玻璃时，提手根部会和画面
         差一个色阶，看过去像两块板中间夹了条缝；填成画面色（顶部略受光）
         才和画面连成同一条轮廓。原稿那圈线框描的就是这个凸起。 -->
    <linearGradient id="handleface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#1c232e"/>
      <stop offset=".55" stop-color="#171d26"/>
      <stop offset="1"   stop-color="#131820"/>
    </linearGradient>

    <filter id="cast" x="-12%" y="-8%" width="124%" height="126%">
      <feDropShadow dx="0" dy="3.2" stdDeviation="4.5" flood-color="#000" flood-opacity=".6"/>
    </filter>

    <clipPath id="clipScreen">
      <rect x="29.219" y="80.260" width="160.151" height="110.589" rx="3"/>
    </clipPath>
  </defs>

  <g filter="url(#cast)">
    <!-- 画面：原稿 rect1 @ (29.219, 80.260) 160.151 × 110.589 -->
    <rect x="29.219" y="80.260" width="160.151" height="110.589" rx="3" fill="url(#screen)"/>

    <!-- 提手：原稿 path1 的四个点，只把落点收到画面顶边 -->
    <path d="M 73.973 80.260 L 88.027 65.171 Q 88.027 64.171 89.027 64.171 L 129.562 64.171 Q 130.562 64.171 130.562 65.171 L 143.137 80.260 Z" fill="url(#handleface)"/>

    <g clip-path="url(#clipScreen)">
      <!-- 内容示意：原稿只有 "content" 一个词，这里换成三行等宽字，尺寸与位置照原稿比例 -->
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
         font-size="3.2" letter-spacing=".02" xml:space="preserve">
        <text x="35.2" y="90.2" fill="#5eead4">JSHeL&gt; <tspan fill="#cbd5e1">hsb2()</tspan></text>
        <text x="35.2" y="95.2" fill="#5b6b7f">  · 已缓存 6 项组件 · FreeBSD 12.0 运行中</text>
        <text x="35.2" y="102.2" fill="#7c8ea3">root@nyu:~ # <tspan fill="#cbd5e1">uname -a</tspan></text>
        <text x="35.2" y="107.2" fill="#8fa3b8">FreeBSD nyu 12.0-RELEASE r341666 GENERIC  i386</text>
        <text x="35.2" y="114.2" fill="#7c8ea3">root@nyu:~ # <tspan fill="#8fa3b8">▍</tspan></text>
      </g>
    </g>

    <!-- 轮廓：画面 + 提手合成一条闭合路径。
         原稿这里是 rect1 + path1 两条：rect 的顶边横穿提手根部，会画出第二条线。
         合并只改"怎么画这条线"，线的走法与原稿逐点一致。 -->
    <path d="M 32.219 80.260
             H 73.973 L 88.027 65.171 Q 88.027 64.171 89.027 64.171 H 129.562 Q 130.562 64.171 130.562 65.171 L 143.137 80.260
             H 186.370 Q 189.370 80.260 189.370 83.260
             V 187.849 Q 189.370 190.849 186.370 190.849
             H 32.219 Q 29.219 190.849 29.219 187.849
             V 83.260 Q 29.219 80.260 32.219 80.260 Z"
          stroke="#ffffff" stroke-opacity=".13" stroke-width=".3"/>

    <!-- 提手顶边高光：只画上沿那一段，不闭合 -->
    <path d="M 89.027 64.171 H 129.562" stroke="#ffffff" stroke-opacity=".26" stroke-width=".3"/>
  </g>

  <!-- ── 四枚色点 ──────────────────────────────────────────────
       原稿：ellipse 61.00 / 73.29 / 147.50 / 162.87，cy≈72.2，rx 4.77~5.49、ry 4.51~5.10
       修订：正圆 r=5.0，cy 取提手带中点 72.216，x 严格镜像于画面中心 109.295

         58.395   72.195   146.395   160.195
           ±50.9    ±37.1      ±37.1     ±50.9

       原稿左右偏移是 -48.3 / -36.0 / +38.2 / +53.6，四边各差几毫米 —— 手绘误差。
       这里取两侧的平均值（50.9 / 37.1），保住"内两点贴提手两脚、外两点再外一档"的关系。
       颜色沿用原稿：window.svg 里的四个椭圆是纯红 / 黄 / 纯绿 / 纯青。 -->
  <g>
    <circle cx="58.395" cy="72.216" r="5" fill="#ff0000" stroke="#ffffff" stroke-opacity=".22" stroke-width=".25"/>
    <circle cx="72.195" cy="72.216" r="5" fill="#ffcc00" stroke="#ffffff" stroke-opacity=".22" stroke-width=".25"/>
    <circle cx="146.395" cy="72.216" r="5" fill="#00ff00" stroke="#ffffff" stroke-opacity=".22" stroke-width=".25"/>
    <circle cx="160.195" cy="72.216" r="5" fill="#00ffff" stroke="#ffffff" stroke-opacity=".22" stroke-width=".25"/>
  </g>

  <!-- 标题：原稿 x=97.682 y=77.283、12.7units。字号按成品改到 4.2（≈17px），仍然居中、
       仍然压在提手下沿；塞不下时中间截断，见 window-fullscreen.svg 的示例。 -->
  <text x="109.295" y="77.35" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif"
        font-size="4.2" font-weight="500" letter-spacing=".04"
        fill="#e8eef6" fill-opacity=".92">hsb2 · FreeBSD 12.0</text>
</svg>
