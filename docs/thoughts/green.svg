<?xml version="1.0" encoding="UTF-8"?>
<!--
  HTerMinaL · 绿点 = 最大化
  ─────────────────────────────────────────────────────────────────────
  基准 = original/green.svg（手绘原稿）。
  原稿是一只**四角星**：四个尖角撑在四角，四条边向内深深凹进去 —— 就是"向四外撑开"。

  这是四个里唯一一个需要重写路径的，原因是原稿那条 path 坏了：
    d="m 28.849,83.959 c 0,0 87.658,63.616 -1.110,131.671
       -88.767,68.055 0.370,-0.370 0.370,-0.370 0,0
       73.603,-72.123 150.904,-0.370 77.301,71.753 -0.370,-0.740 -0.370,-0.740 0,0
       -103.192,-73.603 1.110,-130.192 104.301,-56.589 -0.370,-0.370 -0.370,-0.370 0,0
       -66.205,51.781 -150.534,0.370 z"
    里面夹着 `0.370,-0.370 0.370,-0.370 0,0` 三段退化段，控制点被拖到 (-61,284)、(124,283)，
    整条曲线甩出画布外（实测 x 到 -11.3 / +225.4，y 到 +246.5）。描边因此漏到纸外面。

  修法：沿原稿**实际画出来的轮廓**取 4 个尖角 + 4 个内凹最深点（从原稿渲染的 2100px 图上量的），
  每条边用一段圆弧接回去 —— 圆弧的矢高（sagitta）刚好等于该边量到的凹陷深度，所以形状是量出来的：

    边          弦长     凹陷    半径
    左上→左下   118.53   30.78   72.45
    左下→右下   124.00   21.10  101.65
    右下→右上   110.50   32.30   63.40
    右上→左上   132.75   17.40  135.30

  为什么用三次贝塞尔不用二次：Q 只有一根控制杆，在 t≠0.5 处会比预期更贴向控制点，
  四条边一起塌陷时中心会被整个挖空，星形变成"X"。C 有前后两根杆，可以同时钉住
  "中点过 M"和"两端贴边"，凹陷才是单调的。（试过圆弧，四条弧的圆心互相打架，闭合后成了三角形。）

  另外：白描边去掉（0.5mm 缩到 26px 是 0.09px，只剩噪点），填充换深墨。

  缩放：原稿 bbox 132.8 × 118.2 → 26px 高，居中放进 ⌀40 的圆点。
  ─────────────────────────────────────────────────────────────────────
-->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"
     role="img" aria-labelledby="t d">
  <title id="t">最大化</title>
  <desc id="d">绿色圆点，内为一只四角星：四个尖角朝四角撑开，四条边向内凹。</desc>

  <circle cx="20" cy="20" r="20" fill="#00ff00"/>

  <g transform="translate(-1.710 -11.983) scale(.21997)" fill="#000" opacity=".58">
    <path d="M 32.3 86.3
             C 76.86 132.90 78.26 151.82 41.1 204.5
             C 93.50 175.78 113.34 175.56 165.10 203.1
             C 121.96 156.77 121.92 139.09 164.9 92.6
             C 108.11 113.12 86.89 112.12 32.3 86.3 Z"/>
  </g>
</svg>
