<?xml version="1.0" encoding="UTF-8"?>
<!--
  HTerMinaL · 黄点 = 最小化
  ─────────────────────────────────────────────────────────────────────
  基准 = original/yellow.svg（手绘原稿）。
  原稿是一块「折角」：上边平、右边直，底边一条弧从右上角一路兜回左上角。
  路径数据原样搬过来，一个控制点都没改 —— 这条 path 本来就是干净的。

  只动一处：白描边去掉（原稿 stroke:#fff 是画在白纸上的做法，落到黄底上等于没有），
  填充换深墨，这样黄点上才看得见字。

  缩放：原稿 bbox 129.452 × 135.370 → 26px 高，居中放进 ⌀40 的圆点。
  ─────────────────────────────────────────────────────────────────────
-->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"
     role="img" aria-labelledby="t d">
  <title id="t">最小化</title>
  <desc id="d">黄色圆点，内为一块折角：上边平直、右边垂直，底边由一条长弧兜回左上。</desc>

  <circle cx="20" cy="20" r="20" fill="#ffcc00"/>

  <g transform="translate(-.102 -7.278) scale(.19206)" fill="#000" opacity=".58">
    <path d="M 39.945204 74.342465 H 169.39726 V 209.71233
             c 0,0 7.76712,-87.28767 -129.452056,-135.369865 z"/>
  </g>
</svg>
