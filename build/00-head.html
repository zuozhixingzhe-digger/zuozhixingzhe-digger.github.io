.tl-btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.tl-btn:active{transform:translateY(1px)}
.tl-btn.on{background:rgba(94,234,212,.14);border-color:var(--accent);color:var(--accent)}
.tl-btn.primary{background:rgba(94,234,212,.16);border-color:var(--accent-dim);color:var(--accent)}
.tl-btn.sm{padding:1px 6px;font-size:10px}
.tl-body{flex:1 1 auto;min-height:0;overflow:auto;padding:10px}
.tl-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.tl-row > label{flex:0 0 74px;color:var(--fg-dim);font-size:11px}
.tl-in,.tl select,.tl textarea,.tl input[type=text],.tl input[type=number]{
  background:var(--bg-terminal);border:1px solid var(--line);border-radius:7px;color:var(--fg);
  padding:5px 8px;font:inherit;outline:none;min-width:0}
.tl textarea{width:100%;resize:vertical;line-height:1.65;tab-size:2}
.tl-in:focus,.tl select:focus,.tl textarea:focus,.tl input[type=text]:focus,.tl input[type=number]:focus{border-color:var(--accent-dim)}
.tl select{padding:4px 6px}
.tl-card{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:rgba(255,255,255,.015);margin-bottom:8px}
.tl-card > h4{margin:0 0 7px;font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-mute)}
.tl-kv{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:6px;align-items:center;margin-bottom:4px}
.tl-kv > b{font-weight:400;color:var(--fg-dim);font-size:10.5px}
.tl-kv > code{font-family:var(--mono);font-size:11px;background:var(--bg-terminal);border:1px solid var(--line-soft);
  border-radius:5px;padding:3px 6px;overflow:auto;white-space:pre;color:var(--fg);max-height:90px}
.tl-note{color:var(--fg-mute);font-size:10.5px;line-height:1.85}
.tl-note b{color:var(--fg-dim);font-weight:500}
.tl-maint{height:100%;display:grid;place-items:center;text-align:center;padding:24px}
.tl-maint .ic{font-size:34px;opacity:.5}
.tl-maint h3{margin:10px 0 4px;font-size:14px;font-weight:500;color:var(--fg)}
.tl-maint p{margin:0;color:var(--fg-mute);font-size:11px;line-height:1.9;max-width:44ch}
.tl-maint .badge{display:inline-block;margin-bottom:10px;padding:2px 9px;border-radius:999px;
  border:1px solid var(--line);color:var(--amber);font-size:10px;letter-spacing:.08em}
/* ---- 录音机 / 定位 / 音频 / 3D：四个「终于做出来」的工具 ------------------ */
.tl-tag{letter-spacing:.08em;font-size:10.5px;color:var(--fg-mute);font-weight:400}
.rec-clock{font-family:var(--mono);font-size:30px;letter-spacing:.04em;color:var(--fg);line-height:1;margin:2px 0 8px}
.rec-wave{width:100%;display:block;border-radius:6px;background:rgba(255,255,255,.012)}
.rec-on .rec-dot{color:var(--red);border-color:rgba(248,113,113,.5)}
.rec-on .rec-dot::after{content:"";display:inline-block;width:6px;height:6px;margin-left:6px;border-radius:50%;
  background:var(--red);animation:recBlink 1.1s steps(2,end) infinite}
@keyframes recBlink{50%{opacity:.15}}
.rec-out:empty{display:none}
.geo-panel{position:relative;height:118px;border:1px solid var(--line);border-radius:9px;margin-bottom:9px;
  background:radial-gradient(circle at 50% 50%,rgba(94,234,212,.07),transparent 62%),var(--bg-terminal);overflow:hidden}
.geo-cross{position:absolute;inset:0;display:grid;place-items:center}
.geo-cross i{position:absolute;background:var(--line)}
.geo-cross i:first-child{width:100%;height:1px}
.geo-cross i:nth-child(2){width:1px;height:100%}
.geo-cross span{position:relative;width:14px;height:14px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 6px rgba(94,234,212,.14),0 0 18px rgba(94,234,212,.45);transition:all .45s ease}
.geo-acc{position:absolute;left:9px;bottom:7px;font-size:10px;color:var(--fg-mute);background:rgba(0,0,0,.25);
  padding:2px 6px;border-radius:5px}
.au-drop{display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;text-align:center;
  border:1px dashed var(--line);border-radius:10px;padding:18px 12px;margin-bottom:9px;color:var(--fg-dim);transition:.18s}
.au-drop.on{border-color:var(--accent);background:rgba(94,234,212,.07)}
.au-now{display:flex;flex-direction:column;gap:8px}
.au-name{font-size:12px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.au-wave{width:100%;display:block;border-radius:6px;cursor:pointer;background:rgba(255,255,255,.012)}
.au-ctrl{display:flex;align-items:center;gap:8px}
.au-time{font-family:var(--mono);font-size:10.5px;color:var(--fg-dim);white-space:nowrap;min-width:96px}
.au-seek{flex:1 1 auto;accent-color:var(--accent)}
.au-chk{flex:0 0 auto;display:flex;align-items:center;gap:5px;color:var(--fg-dim)}
.v3d-canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.v3d-canvas:active{cursor:grabbing}
.v3d-hint{position:absolute;left:10px;bottom:8px;font-size:10px;color:var(--fg-mute);pointer-events:none}
.v3d-fail{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:22px;
  background:var(--bg-terminal);color:var(--fg);line-height:1.9}
.tl-split{display:grid;grid-template-columns:1fr 1fr;gap:9px;height:100%;min-height:0}.tl-pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.tl-pane > textarea{flex:1 1 auto;min-height:120px;resize:none}
.tl-prev{flex:1 1 auto;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:12px 14px;
  background:var(--bg-terminal);line-height:1.8;font-family:var(--ui);font-size:12.5px}
.tl-prev h1,.tl-prev h2,.tl-prev h3{margin:.7em 0 .35em;line-height:1.35;font-weight:600}
.tl-prev h1{font-size:1.5em;border-bottom:1px solid var(--line);padding-bottom:.25em}
.tl-prev h2{font-size:1.28em}
.tl-prev h3{font-size:1.1em}
.tl-prev p{margin:.55em 0}
.tl-prev code{font-family:var(--mono);font-size:.9em;background:rgba(94,234,212,.09);border-radius:4px;padding:.1em .35em}
.tl-prev pre{background:var(--bg-2);border:1px solid var(--line);border-radius:7px;padding:9px 11px;overflow:auto}
.tl-prev pre code{background:none;padding:0}
.tl-prev blockquote{margin:.6em 0;padding:.1em 0 .1em .8em;border-left:2px solid var(--accent-dim);color:var(--fg-dim)}
.tl-prev table{border-collapse:collapse;margin:.6em 0;font-size:.95em}
.tl-prev th,.tl-prev td{border:1px solid var(--line);padding:4px 8px}
.tl-prev img{max-width:100%}
.tl-prev a{color:var(--accent-2)}
.tl-prev hr{border:0;border-top:1px solid var(--line);margin:1em 0}

/* 计算器 */
.calc{display:flex;flex-direction:column;height:100%;min-height:0;font-family:var(--mono)}
.calc-disp{flex:0 0 auto;padding:12px 14px 10px;text-align:right;border-bottom:1px solid var(--line-soft);background:rgba(0,0,0,.16)}
.calc-expr{min-height:16px;font-size:11.5px;color:var(--fg-mute);word-break:break-all;line-height:1.5}
.calc-res{font-size:26px;line-height:1.25;color:var(--accent);word-break:break-all;letter-spacing:.01em}
.calc-res.small{font-size:18px}
.calc-flags{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.calc-pad{flex:1 1 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:minmax(30px,1fr);
  gap:5px;padding:8px;min-height:0}
.calc-pad button{border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.025);color:var(--fg);
  font:inherit;font-size:13px;cursor:pointer;padding:0;min-height:30px;transition:.08s}
.calc-pad button:hover{border-color:var(--accent-dim);background:rgba(94,234,212,.07)}
.calc-pad button:active{transform:translateY(1px);background:rgba(94,234,212,.16)}
.calc-pad button.fn{font-size:11px;color:var(--fg-dim)}
.calc-pad button.op{color:var(--amber)}
.calc-pad button.eq{background:rgba(94,234,212,.18);border-color:var(--accent-dim);color:var(--accent);font-size:15px}
.calc-pad button.del{color:var(--red)}
