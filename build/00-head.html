<html lang="zh-CN">
<head>
<meta charset="utf-8">

<!-- 移动端：禁用页面级缩放与双击放大，交由应用自己处理；viewport-fit=cover 走安全区 -->

<style>
/* =====================================================================
 * hterminal · 设计样式
 * 结构沿用参考项目 draw-http-terminal 的「顶部控制栏 + 占满画布的终端 +
 * 右侧更多抽屉」三段式；颜色 token 与 xterm 主题共用同一套变量。
 * 符号字体单独一条 --mono-sym 栈：⌃⌥⇧␛⇥☰⛶ 在缺字体设备上会退化成
 * 方块或彩色 emoji，所以既给符号字体栈，也给 font-variant-emoji:text。
 * ===================================================================== */

/* —— 设计 token —— */
:root{
  /* 底色层次 */
  --bg-0:#070b0b;
  --bg-1:#0a1011;
  --bg-2:#0e1516;
  --bg-terminal:#080d0e;
  --surface:#0f1617;
  --panel:rgba(15,22,23,.94);
  --panel-solid:#0f1617;
  /* 前景 */
  --fg:#d6e7e3;
  --fg-dim:#8aa5a0;
  --fg-mute:#5b7570;
  --fg-muted:#8aa5a0;
  --fg-faint:#5b7570;
  /* 强调色 */
  --accent:#5eead4;
  --accent-dim:#2c8f83;
  --accent-2:#7dd3fc;
  --amber:#fbbf24;
  --red:#f87171;
  --green:#4ade80;
  --blue:#7dd3fc;
  --violet:#c4b5fd;
  /* 线条与阴影 */
  --line:#1d2b2c;
  --line-soft:#162122;
  --border:rgba(120,190,180,.14);
  --border-strong:rgba(120,190,180,.24);
  --shadow:0 18px 60px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.4);
  --shadow-lg:0 24px 70px -20px rgba(0,0,0,.75);
  /* 尺寸 */
  --r:12px;
  --radius-lg:16px;
  --radius-md:10px;
  --radius-sm:8px;
  --bar:36px;
  --top:clamp(44px,7.4vw,54px);
  --cell-pad:16px;
  /* 字体：等宽 / 界面 / 符号 */
  --mono:"JetBrains Mono","Cascadia Code","SF Mono","Fira Code",Menlo,Consolas,"Noto Sans Mono CJK SC","Sarasa Mono SC",monospace;
  --ui:"Inter","Segoe UI Variable","Segoe UI","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
  --mono-sym:"JetBrains Mono","Noto Sans Symbols2","Segoe UI Symbol","Apple Symbols","Noto Sans Symbols","DejaVu Sans",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
body.light{
  --bg-0:#eef2f1; --bg-1:#e8eeec; --bg-2:#e1e9e7; --bg-terminal:#f3f7f6;
  /* 浅色下 --panel 必须不透明：窗口/抽屉靠 backdrop-filter 做玻璃感，
   * 而 backdrop 层在主题切换时不会自动重绘，会留下上一套主题的底色（深色）。 */
  --surface:#fbfdfc; --panel:#fcfdfd; --panel-solid:#fbfdfc;
  --fg:#182624; --fg-dim:#4f6763; --fg-mute:#7b918d; --fg-muted:#4f6763; --fg-faint:#7b918d;
  --accent:#0d9488; --accent-dim:#5aa79e; --accent-2:#0369a1;
  --amber:#b45309; --red:#dc2626; --green:#15803d; --blue:#0369a1; --violet:#6d28d9;
  --line:#cfdad7; --line-soft:#dde6e4;
  --border:rgba(20,60,55,.14); --border-strong:rgba(20,60,55,.24);
  --shadow:0 18px 50px rgba(10,30,28,.18), 0 2px 8px rgba(10,30,28,.12);
  --shadow-lg:0 24px 60px -24px rgba(10,30,28,.35);
}

/* —— 重置 —— */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  position:fixed; inset:0; overflow:hidden;
  background:var(--bg-0); color:var(--fg);
  font-family:var(--ui); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
::selection{background:rgba(94,234,212,.25);color:var(--fg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.94em;color:var(--amber)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* —— 应用外壳：顶栏 + 桌面 —— */
.app{
  position:fixed; inset:0; display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:var(--bg-terminal);
}

/* =====================================================================
 * 顶部控制 / 状态栏
 * ===================================================================== */
.topbar{
  position:relative; z-index:60; flex:0 0 auto;
  height:var(--top); display:flex; align-items:stretch;
  background:linear-gradient(180deg,var(--bg-2),var(--bg-1));
  border-bottom:1px solid var(--border);
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  touch-action:none;
}
.tb-left{
  display:flex; align-items:center; gap:9px; flex:0 0 auto;
  padding:0 12px 0 14px; min-width:0; max-width:52vw;
}
.tb-brand{
  display:flex; align-items:center; gap:8px; flex:0 0 auto;
  font-family:var(--mono); font-size:12.5px; letter-spacing:.02em;
  color:var(--fg); text-decoration:none;
}
.tb-logo{display:flex; flex:0 0 auto; color:var(--accent); filter:drop-shadow(0 0 8px rgba(94,234,212,.45))}
.tb-logo svg{width:17px;height:17px;display:block}
.tb-brand b{font-weight:600;color:var(--fg)}
.tb-ver{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.04em; color:var(--fg-mute);
  border:1px solid var(--border); border-radius:5px; padding:1px 5px; margin-left:2px;
  font-variant-numeric:tabular-nums;
}
.tb-where{
  font-family:var(--mono); font-size:11px; color:var(--fg-dim);
  border:1px solid var(--border); border-radius:999px; padding:2px 9px;
  max-width:26vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  background:rgba(255,255,255,.02);
}
body.light .tb-where{background:rgba(0,0,0,.02)}

/* 中间：符号控制键（修饰键 / Esc / Tab / 方向键） */
.tb-mid{
  display:flex; align-items:stretch; flex:1 1 auto; min-width:0;
  padding-left:4px;
  overflow-x:auto; overflow-y:hidden; scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.tb-mid::-webkit-scrollbar{display:none}
.tb-gap{flex:1 1 auto; min-width:8px}
.tb-right{display:flex; align-items:stretch; flex:0 0 auto; border-left:1px solid var(--border)}

.k{
  flex:0 0 auto; min-width:clamp(32px,7.2vw,40px);
  display:flex; align-items:center; justify-content:center;
  color:var(--fg-dim); font-family:var(--mono-sym);
  font-size:clamp(15px,3.8vw,18px); line-height:1;
  /* 强制文本呈现，避免 ⌃⌥⛶ 被渲染成彩色 emoji 导致大小不一 */
  font-variant-emoji:text;
  border-left:1px solid transparent; border-right:1px solid transparent;
  transition:background .14s var(--ease),color .14s var(--ease);
  touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
}
.k span{pointer-events:none}
.k:active{background:rgba(94,234,212,.16)}
@media (hover:hover){
  .k:hover{color:var(--fg);background:rgba(255,255,255,.055)}
  .k--active:hover{color:#08110f;background:var(--accent)}
}
.tb-mid .k{flex:1 1 0;min-width:28px;max-width:54px}
/* 宽屏不把按键摊到整条栏上——那样看着像漏了内容；窄屏才让它们自己挤满 */
@media (min-width:980px){ .tb-mid{flex:0 1 auto;max-width:560px} }
.tb-right .k{width:clamp(36px,8.4vw,44px);color:var(--fg-mute)}
.tb-right .k:last-child{border-right:0}
/* 锁定（短按切换）＝实心强调色；按住（长按 / 实体键按下）＝更浅的强调色 */
.k--active{background:var(--accent);color:#08110f}
.k--active:active{background:var(--accent)}
.k--pressing{background:#c9f7ee;color:#08110f}
body.light .k--pressing{background:#6fd6c6;color:#04110e}
.k[disabled]{opacity:.32;pointer-events:none}

.sep{
  flex:0 0 1px; align-self:center; height:20px; margin:0 8px;
  background:rgba(120,190,180,.30);
}
body.light .sep{background:rgba(20,60,55,.22)}

/* =====================================================================
 * 桌面：底层终端 + 浮动窗口
 * ===================================================================== */
.desk{
  position:relative; flex:1 1 auto; min-height:0; overflow:hidden;
  background:
    radial-gradient(1100px 620px at 82% -12%, rgba(94,234,212,.08), transparent 62%),
    radial-gradient(900px 560px at -8% 108%, rgba(251,191,36,.045), transparent 60%),
    linear-gradient(180deg,var(--bg-1),var(--bg-0) 58%);
}
.desk::before{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.30; z-index:0;
  background-image:linear-gradient(rgba(120,180,170,.055) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(120,180,170,.055) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 78%);
}
body.nogrid .desk::before{display:none}

/* 底层终端：永远存在的那一个 */
#term-view{
  position:absolute; inset:0; z-index:1;
  padding:var(--cell-pad) var(--cell-pad) 58px;
}
#term{width:100%;height:100%}
#term .xterm{height:100%}
#term .xterm-viewport{background:transparent!important;scrollbar-width:thin}
#term .xterm-screen{will-change:transform}
.xterm .xterm-helpers{position:absolute;z-index:0}
/* 触摸滚动交给 xterm 自己的 viewport，文本层不接收指针事件（避免选中/拖不动） */
#term .xterm-viewport{touch-action:pan-y;overscroll-behavior:none}
#term .xterm-screen,#term .xterm-helper-textarea{pointer-events:none}

/* =====================================================================
 * 窗口
 * ===================================================================== */
#window-layer{position:absolute; inset:0; z-index:20; pointer-events:none}
.win{
  position:absolute; pointer-events:auto; display:flex; flex-direction:column;
  min-width:280px; min-height:150px; border:1px solid var(--line);
  border-radius:var(--r); background:var(--panel); box-shadow:var(--shadow);
  backdrop-filter:blur(18px) saturate(1.1); -webkit-backdrop-filter:blur(18px) saturate(1.1);
  overflow:hidden; animation:winIn .18s cubic-bezier(.2,.9,.3,1);
  will-change:transform,width,height;
}
@keyframes winIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.win.focus{border-color:rgba(94,234,212,.38);box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 0 1px rgba(94,234,212,.10)}
/* 浅色主题关掉玻璃：backdrop-filter 的合成层在主题切换时不会重绘，
 * 会留着上一套主题的底色（深色）——表现为「切到浅色后窗口标题栏还是黑的」。
 * 浅色下面板本来就是不透明的，去掉滤镜没有任何视觉损失。 */
body.light .win,body.light #dock,body.light .drawer,body.light .launcher{
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
}
.win.dragging,.win.resizing{transition:none!important;user-select:none}
.win.min{display:none}
.win.max{border-radius:0}
.win-bar{
  height:var(--bar); flex:0 0 var(--bar); display:flex; align-items:center; gap:8px;
  padding:0 8px; background:linear-gradient(180deg,rgba(255,255,255,.035),transparent);
  border-bottom:1px solid var(--line-soft); cursor:default;
  user-select:none; -webkit-user-select:none;
}
.win.focus .win-bar{background:linear-gradient(180deg,rgba(94,234,212,.055),transparent)}
.win-dots{display:flex;gap:6px;align-items:center;flex:0 0 auto;padding:0 2px}
.win-dots i{width:10px;height:10px;border-radius:50%;background:#2b3a3a;display:block;transition:background .15s}
.win.focus .win-dots i.c{background:#ff5f57}
.win.focus .win-dots i.m{background:#febc2e}
.win.focus .win-dots i.x{background:#28c840}
body.light .win-dots i{background:#c6d2cf}
.win-dots i:hover{filter:brightness(1.25)}
.win-title{
  flex:1 1 auto; min-width:0; text-align:center; font-size:11.5px; letter-spacing:.06em;
  color:var(--fg-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  font-family:var(--mono);
}
.win.focus .win-title{color:var(--fg)}
.win-tools{display:flex;gap:2px;flex:0 0 auto;align-items:center}
.win-tools button{width:24px;height:24px;border-radius:6px;color:var(--fg-mute);font-size:12px;display:grid;place-items:center}
.win-tools button:hover{background:rgba(127,180,170,.12);color:var(--fg)}
.win-body{flex:1 1 auto; min-height:0; position:relative; overflow:hidden; background:rgba(9,13,14,.88)}
body.light .win-body{background:rgba(252,254,253,.94)}
.win-body.pad{padding:14px}
.rz{position:absolute;z-index:5}
.rz.n{top:-3px;left:8px;right:8px;height:7px;cursor:ns-resize}
.rz.s{bottom:-3px;left:8px;right:8px;height:7px;cursor:ns-resize}
.rz.w{left:-3px;top:8px;bottom:8px;width:7px;cursor:ew-resize}
.rz.e{right:-3px;top:8px;bottom:8px;width:7px;cursor:ew-resize}
.rz.nw{left:-3px;top:-3px;width:12px;height:12px;cursor:nwse-resize}
.rz.ne{right:-3px;top:-3px;width:12px;height:12px;cursor:nesw-resize}
.rz.sw{left:-3px;bottom:-3px;width:12px;height:12px;cursor:nesw-resize}
.rz.se{right:-3px;bottom:-3px;width:12px;height:12px;cursor:nwse-resize}
.win-snap{
  position:absolute;z-index:19;pointer-events:none;display:none;
  border:1px solid rgba(94,234,212,.6); background:rgba(94,234,212,.09); border-radius:8px;
}

/* =====================================================================
 * 任务栏
 * ===================================================================== */
#dock{
  position:absolute; left:50%; bottom:10px; transform:translateX(-50%); z-index:70;
  display:flex; align-items:center; gap:4px; padding:4px; border-radius:14px;
  border:1px solid var(--line); background:var(--panel);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  box-shadow:0 10px 34px rgba(0,0,0,.35); max-width:calc(100vw - 24px);
  overflow-x:auto; scrollbar-width:none;
}
#dock::-webkit-scrollbar{display:none}
.dock-item{
  display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:10px;
  font-size:11.5px;color:var(--fg-dim);white-space:nowrap;max-width:180px;
}
.dock-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock-item b{display:grid;place-items:center;color:var(--accent);font-size:11px;font-weight:500;flex:0 0 auto}
.dock-item b svg{width:15px;height:15px}
.dock-item:hover{background:rgba(94,234,212,.09);color:var(--fg)}
.dock-item.focus{background:rgba(94,234,212,.13);color:var(--fg);box-shadow:inset 0 0 0 1px rgba(94,234,212,.18)}
.dock-item.min{opacity:.55}
.dock-sep{width:1px;height:18px;background:var(--line);margin:0 2px}

/* =====================================================================
 * 右侧「更多」抽屉
 * ===================================================================== */
.drawer-overlay{
  position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.52);
  opacity:0; visibility:hidden; transition:opacity .22s var(--ease),visibility .22s;
}
.drawer-overlay.on{opacity:1;visibility:visible}
.drawer{
  position:fixed; top:0; right:0; bottom:0; z-index:110;
  width:min(380px,90vw); display:flex; flex-direction:column;
  background:var(--bg-2); border-left:1px solid var(--border-strong);
  box-shadow:-18px 0 50px -20px rgba(0,0,0,.8);
  transform:translateX(100%); transition:transform .26s var(--ease);
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  user-select:none; -webkit-user-select:none;
  overscroll-behavior:contain; touch-action:pan-y;
}
.drawer.on{transform:none}
.drawer__user{
  display:flex; align-items:center; gap:11px; flex:0 0 auto;
  padding:15px 14px 13px; border-bottom:1px solid var(--border);
}
.drawer__avatar{
  width:38px;height:38px;flex:0 0 auto;display:grid;place-items:center;
  border-radius:11px;font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:-.06em;
  line-height:1; color:#04110e;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 6px 18px -6px rgba(94,234,212,.6);
}
.drawer__meta{flex:1 1 auto;min-width:0}
.drawer__uname{
  display:flex; align-items:center; gap:6px;
  font-size:13.5px; font-weight:600; color:var(--fg);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.drawer__ver{
  font-family:var(--mono); font-size:9.5px; font-weight:400; color:var(--fg-mute);
  border:1px solid var(--border); border-radius:5px; padding:1px 5px;
  font-variant-numeric:tabular-nums;
}
.drawer__sub{
  margin-top:2px; font-family:var(--mono); font-size:10.5px; color:var(--fg-mute);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.drawer__close{
  flex:0 0 auto; width:30px; height:30px; border-radius:8px;
  display:grid; place-items:center; color:var(--fg-mute);
  font-family:var(--mono-sym); font-size:14px;
}
.drawer__close:hover{background:rgba(255,255,255,.07);color:var(--fg)}

.drawer__body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:8px}
.drawer__section{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.drawer__section:last-child{border-bottom:0}
.drawer__title{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  margin:0 0 8px; font-size:11px; font-weight:600; letter-spacing:.12em;
  text-transform:uppercase; color:var(--fg-mute);
}
.drawer__row{
  display:flex; align-items:center; gap:10px;
  padding:5px 0; font-size:12.5px; color:var(--fg-dim);
}
.drawer__row > span{flex:0 0 72px;color:var(--fg-muted)}
.drawer__row > b{
  flex:0 0 auto; margin-left:auto; color:var(--fg); font-weight:500;
  font-family:var(--mono); font-size:11.5px; font-variant-numeric:tabular-nums;
}
.drawer__row input[type=range]{flex:1 1 auto;min-width:0;accent-color:var(--accent);touch-action:none}
.drawer__row select,.drawer__row input[type=text],.drawer__row input[type=password],.drawer__row input[type=number]{
  flex:1 1 auto; min-width:0; background:var(--bg-0); border:1px solid var(--border);

}
.drawer__row select{max-width:150px;flex:0 1 150px}

.drawer__grid{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 6px}
.drawer__note{font-size:10.5px;line-height:1.7;color:var(--fg-faint);padding:4px 0 6px}
.drawer__list{display:flex;flex-direction:column;gap:4px;padding:2px 0 6px;max-height:220px;overflow:auto}
.drawer__item{

}

.drawer__item .tag{font-size:9px;padding:1px 5px;border:1px solid var(--border);border-radius:4px;color:var(--fg-mute)}
.drawer__item button{width:20px;height:20px;border-radius:5px;color:var(--fg-mute);font-size:11px}
.drawer__item button:hover{color:var(--red);background:rgba(248,113,113,.1)}
.drawer__foot{

}
.drawer__foot a{color:var(--accent-dim);text-decoration:none}

/* 通用小控件（抽屉内复用） */
.dbtn{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;
  border:1px solid var(--border);border-radius:8px;font-size:11.5px;
  color:var(--fg-dim);background:rgba(127,180,170,.04);
}
.dbtn:hover{border-color:var(--accent-dim);color:var(--accent);background:rgba(94,234,212,.07)}
.dbtn.primary{border-color:var(--accent-dim);color:var(--accent);background:rgba(94,234,212,.09)}
.dbtn.danger{color:var(--red);border-color:rgba(248,113,113,.24)}

}

/* =====================================================================
 * 应用启动器（顶栏 ▦）
 * ===================================================================== */
.launcher{
  position:fixed; z-index:120; top:calc(var(--top) + env(safe-area-inset-top) + 6px); right:10px;
  width:min(230px,84vw); padding:6px;
  background:var(--panel-solid); border:1px solid var(--border-strong);
  border-radius:12px; box-shadow:var(--shadow-lg);
  display:flex; flex-direction:column; gap:2px;
  animation:pop .14s var(--ease);
}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.launcher button{
  display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius:8px;
  font-size:12.5px; color:var(--fg-dim); text-align:left;
}
.launcher button:hover{background:rgba(94,234,212,.10);color:var(--fg)}
.launcher button svg{width:16px;height:16px;flex:0 0 auto;color:var(--accent)}
.launcher button i{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:10px;color:var(--fg-faint)}
.launcher hr{border:0;border-top:1px solid var(--border);margin:4px 2px}

/* =====================================================================
 * 启动屏
 * ===================================================================== */
#boot{
  position:absolute; inset:0; z-index:900; display:grid; place-items:center;
  background:radial-gradient(800px 500px at 50% 40%,#0d1415,#070a0b 70%);
  transition:opacity .45s ease, visibility .45s;
}
body.light #boot{background:radial-gradient(800px 500px at 50% 40%,#f7fbfa,#e7efed 70%)}
#boot.gone{opacity:0;visibility:hidden}
.boot-inner{width:min(560px,86vw);font-family:var(--mono)}
.boot-logo{color:var(--accent);font-size:12px;line-height:1.15;white-space:pre;letter-spacing:0}
.boot-title{margin:18px 0 4px;font-size:13px;letter-spacing:.35em;color:var(--fg-dim);text-transform:uppercase}
.boot-title span{letter-spacing:.06em;font-size:10.5px;color:var(--fg-faint);margin-left:6px;
  border:1px solid var(--border);border-radius:4px;padding:1px 5px;vertical-align:1px}
.boot-sub{font-size:11px;color:var(--fg-mute);line-height:1.7}
.boot-bar{margin-top:22px;height:2px;background:var(--line-soft);overflow:hidden;border-radius:2px}
.boot-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--amber));transition:width .3s}
.boot-log{margin-top:12px;font-size:10.5px;color:var(--fg-mute);height:16px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.boot-err{color:var(--red);white-space:pre-wrap;font-size:11px;line-height:1.6;margin-top:14px}
.noscript{
  position:fixed;inset:0;z-index:999;display:grid;place-items:center;
  background:var(--bg-0);color:var(--fg);font-family:var(--mono);font-size:13px;text-align:center;padding:24px;
}

/* =====================================================================
 * 模态 / Toast
 * ===================================================================== */
#modal-root{position:fixed;inset:0;z-index:200;pointer-events:none;display:grid;place-items:center}
.modal-wrap{position:absolute;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);
  display:grid;place-items:center;pointer-events:auto;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:min(520px,92vw);max-height:86vh;display:flex;flex-direction:column;background:var(--panel-solid);
  border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;
  animation:winIn .18s}
.modal h3{margin:0;padding:16px 18px 12px;font-size:13px;letter-spacing:.05em;color:var(--fg);font-weight:600}
.modal .mbody{padding:0 18px 6px;overflow:auto;font-size:12px;line-height:1.65;color:var(--fg-dim)}
.modal .mfoot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px 16px}
.modal pre{margin:0;font-family:var(--mono);font-size:11px;line-height:1.6;white-space:pre-wrap;word-break:break-word;
  background:var(--bg-0);border:1px solid var(--line-soft);border-radius:8px;padding:10px;color:var(--fg-dim)}
.modal .code{font-family:var(--mono);font-size:11px;color:var(--amber)}

#toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 62px);
  transform:translate(-50%,10px);z-index:300;
  padding:8px 14px;border:1px solid var(--border-strong);border-radius:9px;background:var(--panel-solid);
  box-shadow:var(--shadow);font-size:12px;color:var(--fg);
  opacity:0;visibility:hidden;transition:.2s var(--ease);
  max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#toast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}
#toast.bad{border-color:rgba(248,113,113,.4);color:var(--red)}

/* =====================================================================
 * 窗口内各应用
 * ===================================================================== */
.win-term{position:absolute;inset:0;padding:8px 10px 10px}
.win-term .xterm{height:100%}
.win-term .xterm-viewport{background:transparent!important;touch-action:pan-y}

/* 浏览器 */
.br{display:flex;flex-direction:column;height:100%;background:var(--bg-0)}
.br-bar{display:flex;align-items:center;gap:5px;padding:6px 8px;border-bottom:1px solid var(--line-soft);flex:0 0 auto}
.br-bar button{width:26px;height:26px;border-radius:6px;color:var(--fg-mute);display:grid;place-items:center;font-family:var(--mono-sym);font-size:13px}
.br-bar button:hover{background:rgba(127,180,170,.12);color:var(--fg)}
.br-bar button:disabled{opacity:.3;pointer-events:none}
.br-addr{flex:1;display:flex;align-items:center;gap:7px;height:28px;padding:0 10px;background:var(--bg-2);
  border:1px solid var(--border);border-radius:8px;min-width:0}
.br-addr .lock{color:var(--fg-mute);font-size:10px;font-family:var(--mono-sym)}
.br-addr input{flex:1;min-width:0;background:none;border:0;outline:none;font-family:var(--mono);font-size:11.5px;color:var(--fg)}
.br-frame{flex:1;position:relative;background:#fff;min-height:0}
.br-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.br-frame .br-fallback{position:absolute;inset:0;display:none;place-items:center;padding:30px;background:var(--panel-solid);
  color:var(--fg-dim);font-size:12px;line-height:1.8;text-align:center}
.br-frame.blocked iframe{display:none}
.br-frame.blocked .br-fallback{display:grid}
.br-tabs{display:flex;gap:2px;padding:4px 6px 0;border-bottom:1px solid var(--line-soft);overflow:auto;flex:0 0 auto;scrollbar-width:none}
.br-tabs::-webkit-scrollbar{display:none}
.br-tab{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:7px 7px 0 0;font-size:11px;color:var(--fg-mute);
  max-width:160px;white-space:nowrap;border:1px solid transparent;border-bottom:0}
.br-tab span{overflow:hidden;text-overflow:ellipsis}
.br-tab i{font-style:normal;opacity:.5;font-size:10px}
.br-tab:hover{color:var(--fg);background:rgba(127,180,170,.06)}
.br-tab.on{color:var(--fg);background:var(--bg-0);border-color:var(--line-soft)}

/* 文件管理器 */
.fm{display:flex;flex-direction:column;height:100%;font-family:var(--mono);font-size:11.5px}
.fm-bar{display:flex;align-items:center;gap:6px;padding:7px 9px;border-bottom:1px solid var(--line-soft);flex:0 0 auto}
.fm-path{flex:1;color:var(--accent);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fm-list{flex:1;overflow:auto;padding:6px}
.fm-row{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:6px;color:var(--fg-dim);cursor:default}
.fm-row:hover{background:rgba(127,180,170,.07);color:var(--fg)}
.fm-row .ico{width:15px;text-align:center;color:var(--fg-mute)}
.fm-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fm-row .kd{font-size:9px;color:var(--fg-mute);border:1px solid var(--border);border-radius:4px;padding:0 4px}
.fm-row .sz{font-size:9.5px;color:var(--fg-mute);min-width:52px;text-align:right}
.fm-prev{height:38%;border-top:1px solid var(--line-soft);overflow:auto;padding:9px 11px;white-space:pre-wrap;
  word-break:break-word;font-size:10.5px;line-height:1.65;color:var(--fg-dim);background:rgba(0,0,0,.14)}
.fm-empty{padding:24px;text-align:center;color:var(--fg-mute);font-size:11px}

/* 智能体 */
.ag{display:flex;flex-direction:column;height:100%;background:transparent}
.ag-head{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line-soft);flex:0 0 auto}
.ag-status{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--fg-mute);font-family:var(--mono)}
.ag-status i{width:6px;height:6px;border-radius:50%;background:var(--fg-mute);display:block}
.ag-status.on i{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.ag-status.err i{background:var(--red)}
.ag-head .grow{flex:1}
.ag-log{flex:1;overflow-y:auto;padding:12px 12px 4px;display:flex;flex-direction:column;gap:9px}
.msg{max-width:94%;font-size:11.8px;line-height:1.6;border-radius:9px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:rgba(94,234,212,.10);border:1px solid rgba(94,234,212,.20);color:var(--fg)}
.msg.assistant{align-self:flex-start;background:rgba(127,180,170,.06);border:1px solid var(--line-soft);color:var(--fg-dim)}
.msg.tool{align-self:stretch;background:rgba(251,191,36,.045);border:1px solid rgba(251,191,36,.16);
  color:var(--fg-mute);font-family:var(--mono);font-size:10.3px;line-height:1.55;max-height:180px;overflow:auto}
.msg.tool b{color:var(--amber);font-weight:500}
.msg.error{align-self:stretch;background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.2);color:var(--red);font-size:10.5px}
.msg.sys{align-self:center;font-size:10px;color:var(--fg-mute);background:none;border:0;text-align:center}
.msg .role{display:block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-mute);margin-bottom:3px;font-family:var(--mono)}
.ag-input{flex:0 0 auto;border-top:1px solid var(--line-soft);padding:9px 10px 10px}
.ag-input textarea{width:100%;min-height:54px;max-height:140px;resize:none;background:var(--bg-0);border:1px solid var(--border);

.ag-input textarea:focus{border-color:var(--accent-dim)}
.ag-actions{display:flex;align-items:center;gap:6px;margin-top:6px}
.ag-actions .grow{flex:1}
.ag-hint{font-size:9.5px;color:var(--fg-mute);font-family:var(--mono)}

/* 编辑器 */
.editor{width:min(760px,94vw);height:min(560px,80vh)}
.editor textarea{width:100%;height:100%;background:var(--bg-0);border:0;outline:none;resize:none;
  padding:12px;font-family:var(--mono);font-size:11.5px;line-height:1.65;color:var(--fg);tab-size:2}

 * ===================================================================== */

}
